[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "torch_uncertainty"
version = "0.13.0"
authors = [
  { name = "Adrien Lafage", email = "adrienlafage@outlook.com" },
  { name = "Olivier Laurent", email = "olivier.ar.laurent@gmail.com" },
]
description = "Uncertainty quantification in PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.14"

license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = [
  "bayesian-network",
  "ensembles",
  "neural-networks",
  "predictive-uncertainty",
  "reliable-ai",
  "trustworthy-machine-learning",
  "uncertainty",
  "uncertainty-quantification",
]

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
    "einops",
    "seaborn",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "docs" },
]

lint = ["ruff==0.15.14", "pre-commit", "pre-commit-hooks"]
test = ["torch_uncertainty[all]", "pytest-cov"]
docs = [
  "sphinx==7.4.7",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "sphinx-gallery",
  "sphinx-design",
  "sphinx-codeautolink",
  "sphinx_design",
  "sphinx_autodoc_typehints",
  "sphinxcontrib-sass",
]


[project.optional-dependencies]
all = ["torch_uncertainty[experiments,image,distribution,timeseries,others]"]
experiments = ["mlflow", "huggingface-hub>=0.31", "safetensors"]
image = ["kornia", "h5py", "opencv-python", "scikit-image", "torch-uncertainty-assets"]
distribution = ["scipy"]
timeseries = ["tslearn>=0.9"]
others = [
  "scikit-learn!=1.6.0,<1.7",
  "curvlinops-for-pytorch<3",
  "laplace-torch",
  "glest==0.0.1a1",
]

cpu = [
  "torch>=2.1.0,<3.0",
  "torchvision>=0.16.0",
  "lightning[pytorch_extra]>=2.0,<2.7",
  "timm",
]

gpu = [
  "torch>=2.1.0,<3.0",
  "torchvision>=0.16.0",
  "lightning[pytorch_extra]>=2.0,<2.7",
  "timm",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
exclude-newer = "7 days"
exclude-newer-package = {torch = false, ruff = false}

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[project.urls]
homepage = "https://torch-uncertainty.github.io/"
documentation = "https://torch-uncertainty.github.io/quickstart.html"
repository = "https://github.com/torch-uncertainty/torch-uncertainty.git"

[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "__pycache__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "venv",
]

[tool.ruff.lint]
extend-select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "D",
  "ERA",
  "F",
  "FURB",
  "G",
  "I",
  "INT",
  "ISC",
  "ICN",
  "N",
  "NPY",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RUF",
  "RSE",
  "S",
  "SIM",
  "T20",
  "TC",
  "TCH",
  "TID",
  "TRY",
  "UP",
  "YTT",
]
ignore = [
  "ARG002",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "D205",
  "D206",
  "ISC001",
  "N818",
  "N812",
  "PT011",
  "RUF012",
  "S101",
  "TRY003",
]
pydocstyle.convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.pytest.ini_options]
filterwarnings = [
    # Lightning: GPU available but not used in CPU tests
    "ignore:GPU available but not used.*:UserWarning",
    # Lightning: 1-batch fast_dev_run < log_every_n_steps=50
    "ignore:The number of training batches.*is smaller than the logging interval.*:UserWarning",
    # Lightning: self.log() called before Trainer is attached
    "ignore:.*self\\.log.*trainer.*reference is not registered.*:UserWarning",
    # Lightning: _pytree LeafSpec deprecation
    "ignore:.*LeafSpec.*is deprecated.*:FutureWarning",
    # torch.jit.script deprecated (used internally by some third-party libs)
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning",
    # laplace-torch unconditional reminder for classification
    "ignore:By default `link_approx` is `probit`.*:UserWarning",
    # sklearn: k-fold on tiny datasets
    "ignore:The least populated class.*:UserWarning",
    # torchmetrics: distribution missing icdf()
    "ignore:The distribution does not support the.*icdf.*:UserWarning",
    # torchmetrics: FPR95 / VariationRatio / GroupingLoss buffer size notice
    "ignore:Metric.*will save all.*buffer.*:UserWarning",
    # Python multiprocessing fork in multi-threaded process
    "ignore:This process.*is multi-threaded, use of fork.*:DeprecationWarning",
    # Computing segmentation metrics without .update
    "ignore:The.*method of metric.*was called before.*:UserWarning",
    # Applying softmax if PAvPU is given logits
    "ignore:Preds do not seem to be probabilities.*:UserWarning",
    # 0 variance dataset when plotting
    "ignore:Dataset has 0 variance; skipping density estimate.*:UserWarning",
    # jsonargparse v4.49+ deprecations inside lightning itself (add_instantiator)
    "ignore::jsonargparse._deprecated.JsonargparseDeprecationWarning",
    ]

[tool.coverage.run]
branch = true
include = ["*/torch-uncertainty/*"]
omit = ["*/tests/*", "*/datasets/*", ".venv/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
  "coverage: ignore",
  "raise NotImplementedError",
  "raise ImportError",
]
ignore_errors = true
